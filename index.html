<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager — Bootstrap.
         Los snippets reales se editan desde el panel Admin (Marketing → Google).
         Para preservar carga temprana en visitas recurrentes, cacheamos el
         último snippet del head en localStorage y lo inyectamos aquí antes de
         que React monte. En la primera visita, el GoogleTagsProvider lo
         inyecta cuando se lee la config. -->
    <script>
      (function () {
        try {
          var head = localStorage.getItem('__gtm_head_cache');
          if (head) {
            var tpl = document.createElement('template');
            tpl.innerHTML = head;
            tpl.content.querySelectorAll('script').forEach(function (oldS) {
              var s = document.createElement('script');
              for (var i = 0; i < oldS.attributes.length; i++) {
                s.setAttribute(oldS.attributes[i].name, oldS.attributes[i].value);
              }
              s.text = oldS.textContent || '';
              oldS.replaceWith(s);
            });
            Array.from(tpl.content.childNodes).forEach(function (n) {
              if (n.nodeType === 1) n.setAttribute('data-gtm-bootstrap', 'head');
            });
            document.head.appendChild(tpl.content);
          }
        } catch (e) {}
      })();
    </script>
    <!-- End Google Tag Manager Bootstrap -->

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=catarsis-20260516a" />

    <meta name="facebook-domain-verification" content="7ujgcdetxf6ozj6tly2n2n4hds6bhr" />

    <!-- ================================================
         SEO BÁSICO
         Controla cómo aparece en Google y otros buscadores.
         Title y description son lo primero que ve el usuario
         en los resultados — contienen las palabras clave
         principales del negocio y su ubicación exacta.
         ================================================ -->
    <title>Catarsis Drinks & Food | Hamburguesas, Pizzas y Coctelería en Lechería</title>
    <meta name="description" content="Restaurante en CC Aventura Plaza, Lechería, Anzoátegui. Hamburguesas artesanales (Clásica Americana, Honeyholic, BBQ Champions, Smash), pizzas, emparedados y coctelería hasta la 1 AM los fines de semana. Aceptamos dólares, bolívares, Pago Móvil, Zelle y tarjetas." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Catarsis Drinks & Food" />

    <!-- Canonical: URL oficial de esta página.
         Evita penalizaciones por contenido duplicado en Google. -->
    <link rel="canonical" href="https://www.catarsiszone.com/" />

    <!-- ================================================
         SEO LOCAL — GEOLOCALIZACIÓN
         Indica a Google la ubicación física exacta del negocio.
         Fundamental para aparecer en búsquedas locales como
         "restaurante en Lechería" o "hamburguesas Anzoátegui".
         Coordenadas: CC Aventura Plaza, Lechería, Anzoátegui.
         ================================================ -->
    <meta name="geo.region" content="VE-B" />
    <meta name="geo.placename" content="Lechería, Anzoátegui, Venezuela" />
    <meta name="geo.position" content="10.1833;-64.6897" />
    <meta name="ICBM" content="10.1833, -64.6897" />

    <!-- PERFORMANCE [FUENTES]: preconnect establece la conexión
         anticipadamente con Google Fonts. media="print" + onload
         carga la fuente sin bloquear el render inicial.
         display=swap evita texto invisible mientras carga.
         Mejora FCP en móvil. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'">
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap">
    </noscript>

    <!-- ================================================
         OPEN GRAPH
         Vista previa al compartir en Facebook, WhatsApp,
         LinkedIn y otras redes sociales.
         Incluye nombre de platos y horario para mayor relevancia
         en búsquedas y compartidos locales.
         ================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Catarsis Drinks & Food" />
    <meta property="og:title" content="Catarsis Drinks & Food | Hamburguesas y Coctelería en Lechería" />
    <meta property="og:description" content="Honeyholic Burger, BBQ Champions, Smash y más hamburguesas artesanales. Pizzas, emparedados y coctelería hasta la 1 AM. CC Aventura Plaza, Lechería. Aceptamos Pago Móvil, Zelle y dólares." />
    <meta property="og:url" content="https://www.catarsiszone.com" />
    <meta property="og:locale" content="es_VE" />
    <!-- og:image: imagen principal para previsualizaciones en redes.
         Tamaño recomendado: 1200x630px.
         Reemplazar og-image.jpg con la URL real de la imagen del local. -->
    <meta property="og:image" content="https://www.catarsiszone.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catarsis Drinks & Food — Hamburguesas y Coctelería en CC Aventura Plaza, Lechería" />

    <!-- ================================================
         TWITTER / X CARD
         Vista previa al compartir en Twitter/X.
         summary_large_image muestra la imagen en formato
         grande, más visible en el feed.
         ================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Catarsis Drinks & Food | Lechería, Venezuela" />
    <meta name="twitter:description" content="Hamburguesas artesanales, pizzas y coctelería hasta la 1 AM. CC Aventura Plaza, Lechería. Pago Móvil, Zelle y dólares." />
    <!-- twitter:image: misma imagen que og:image -->
    <meta name="twitter:image" content="https://www.catarsiszone.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Catarsis Drinks & Food — Restaurante en Lechería" />

    <!-- ================================================
         EXPERIENCIA MÓVIL
         theme-color define el color de la barra del navegador
         en Android/Chrome. Se usa Rich Black (#010C23),
         color principal del brandbook de Catarsis.
         ================================================ -->
    <meta name="theme-color" content="#010C23" />

    <!-- PERFORMANCE [PRELOAD HERO]: No se aplica preload estático
         porque la imagen hero viene de la DB (URLs dinámicas vía
         useHeroSlides) y el fallback es un asset de Vite con hash
         dinámico. Un <link rel="preload"> con ruta fija no funcionaría. -->

    <!-- Metricool Tracking Code is loaded dynamically by MetricoolProvider -->
  </head>

  <body>
    <!-- Google Tag Manager (noscript) — Bootstrap.
         Inyecta el snippet body cacheado en localStorage como primer hijo del
         body para que el iframe noscript esté disponible aun antes de React. -->
    <script>
      (function () {
        try {
          var body = localStorage.getItem('__gtm_body_cache');
          if (body) {
            var tpl = document.createElement('template');
            tpl.innerHTML = body;
            Array.from(tpl.content.childNodes).forEach(function (n) {
              if (n.nodeType === 1) n.setAttribute('data-gtm-bootstrap', 'body');
            });
            document.body.insertBefore(tpl.content, document.body.firstChild);
          }
        } catch (e) {}
      })();
    </script>


    <!-- Meta Pixel noscript fallback -->
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1428549534945171&ev=PageView&noscript=1" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- FACEBOOK PIXEL: Movido al final del body para no bloquear
         el render inicial. No usar defer — puede perder eventos
         si el usuario navega antes de que cargue.
         No modificar — tracking activo para campañas en Meta. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    </script>
  </body>
</html>
