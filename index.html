<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=catarsis-20260325" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=catarsis-20260325" />
    <link rel="shortcut icon" href="/favicon.ico?v=catarsis-20260325" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png?v=catarsis-20260325" />
    <meta name="msapplication-TileImage" content="/favicon.png?v=catarsis-20260325" />
    <meta name="facebook-domain-verification" content="7ujgcdetxf6ozj6tly2n2n4hds6bhr" />

    <!-- ================================================
         SEO BÁSICO
         Controla cómo aparece en Google y otros buscadores.
         Title y description son lo primero que ve el usuario
         en los resultados — contienen las palabras clave
         principales del negocio y su ubicación exacta.
         ================================================ -->
    <title>Catarsis Drinks & Food | Hamburguesas, Pizzas y Coctelería en Lechería</title>
    <meta name="description" content="Restaurante en CC Aventura Plaza, Lechería, Anzoátegui. Hamburguesas artesanales (Clásica Americana, Honeyholic, BBQ Champions, Smash), pizzas, emparedados y coctelería hasta la 1 AM los fines de semana. Aceptamos dólares, bolívares, Pago Móvil, Zelle y tarjetas." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Catarsis Drinks & Food" />

    <!-- Canonical: URL oficial de esta página.
         Evita penalizaciones por contenido duplicado en Google. -->
    <link rel="canonical" href="https://www.catarsiszone.com/" />

    <!-- ================================================
         SEO LOCAL — GEOLOCALIZACIÓN
         Indica a Google la ubicación física exacta del negocio.
         Fundamental para aparecer en búsquedas locales como
         "restaurante en Lechería" o "hamburguesas Anzoátegui".
         Coordenadas: CC Aventura Plaza, Lechería, Anzoátegui.
         ================================================ -->
    <meta name="geo.region" content="VE-B" />
    <meta name="geo.placename" content="Lechería, Anzoátegui, Venezuela" />
    <meta name="geo.position" content="10.1833;-64.6897" />
    <meta name="ICBM" content="10.1833, -64.6897" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ================================================
         OPEN GRAPH
         Vista previa al compartir en Facebook, WhatsApp,
         LinkedIn y otras redes sociales.
         Incluye nombre de platos y horario para mayor relevancia
         en búsquedas y compartidos locales.
         ================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Catarsis Drinks & Food" />
    <meta property="og:title" content="Catarsis Drinks & Food | Hamburguesas y Coctelería en Lechería" />
    <meta property="og:description" content="Honeyholic Burger, BBQ Champions, Smash y más hamburguesas artesanales. Pizzas, emparedados y coctelería hasta la 1 AM. CC Aventura Plaza, Lechería. Aceptamos Pago Móvil, Zelle y dólares." />
    <meta property="og:url" content="https://www.catarsiszone.com" />
    <meta property="og:locale" content="es_VE" />
    <!-- og:image: imagen principal para previsualizaciones en redes.
         Tamaño recomendado: 1200x630px.
         Reemplazar og-image.jpg con la URL real de la imagen del local. -->
    <meta property="og:image" content="https://www.catarsiszone.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catarsis Drinks & Food — Hamburguesas y Coctelería en CC Aventura Plaza, Lechería" />

    <!-- ================================================
         TWITTER / X CARD
         Vista previa al compartir en Twitter/X.
         summary_large_image muestra la imagen en formato
         grande, más visible en el feed.
         ================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Catarsis Drinks & Food | Lechería, Venezuela" />
    <meta name="twitter:description" content="Hamburguesas artesanales, pizzas y coctelería hasta la 1 AM. CC Aventura Plaza, Lechería. Pago Móvil, Zelle y dólares." />
    <!-- twitter:image: misma imagen que og:image -->
    <meta name="twitter:image" content="https://www.catarsiszone.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Catarsis Drinks & Food — Restaurante en Lechería" />

    <!-- ================================================
         EXPERIENCIA MÓVIL
         theme-color define el color de la barra del navegador
         en Android/Chrome. Se usa Rich Black (#010C23),
         color principal del brandbook de Catarsis.
         ================================================ -->
    <meta name="theme-color" content="#010C23" />

    <!-- ================================================
         FACEBOOK PIXEL
         No modificar — tracking activo para campañas en Meta.
         ================================================ -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Metricool Tracking Code is loaded dynamically by MetricoolProvider -->
  </head>
